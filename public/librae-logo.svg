<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001A40" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000A1A" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGlow)" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.5"/>

  <!-- Outer precision ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#D4AF37" stroke-width="0.4" stroke-opacity="0.3" stroke-dasharray="3 6"/>

  <!-- Terrain topographic lines (bottom) — emerald -->
  <path d="M 20 85 Q 35 78 50 83 Q 65 88 80 80 Q 95 73 100 80" fill="none" stroke="#2E8B57" stroke-width="1" stroke-opacity="0.5" filter="url(#softglow)"/>
  <path d="M 28 92 Q 42 85 58 89 Q 72 93 88 86 Q 96 83 102 87" fill="none" stroke="#2E8B57" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- Balance beam (horizontal bar) -->
  <line x1="30" y1="52" x2="90" y2="52" stroke="url(#goldGlow)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center post -->
  <line x1="60" y1="35" x2="60" y2="68" stroke="url(#goldGlow)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center top finial -->
  <circle cx="60" cy="33" r="3" fill="url(#goldGlow)" filter="url(#glow)"/>

  <!-- Center pivot node (the glowing dot) -->
  <circle cx="60" cy="52" r="4.5" fill="url(#goldGlow)" filter="url(#glow)"/>
  <circle cx="60" cy="52" r="2" fill="#FFF8DC"/>

  <!-- Left arm down-chain -->
  <line x1="30" y1="52" x2="30" y2="63" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- Right arm up-chain -->
  <line x1="90" y1="52" x2="90" y2="45" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Left scale pan -->
  <path d="M 18 65 Q 30 62 42 65" fill="none" stroke="url(#goldGlow)" stroke-width="1.6" stroke-linecap="round" filter="url(#softglow)"/>
  <!-- Right scale pan -->
  <path d="M 78 47 Q 90 44 102 47" fill="none" stroke="url(#goldGlow)" stroke-width="1.6" stroke-linecap="round" filter="url(#softglow)"/>

  <!-- Crosshair precision lines (geo targeting) -->
  <line x1="60" y1="10" x2="60" y2="20" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="10" y1="52" x2="20" y2="52" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="100" y1="52" x2="110" y2="52" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Corner tick marks (instrument precision) -->
  <line x1="22" y1="22" x2="27" y2="27" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="98" y1="22" x2="93" y2="27" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Satellite data pulse dots -->
  <circle cx="22" cy="40" r="1.5" fill="#4A9EFF" fill-opacity="0.7"/>
  <circle cx="98" cy="40" r="1.5" fill="#4A9EFF" fill-opacity="0.7"/>
  <circle cx="35" cy="95" r="1.2" fill="#2E8B57" fill-opacity="0.6"/>
  <circle cx="85" cy="95" r="1.2" fill="#2E8B57" fill-opacity="0.6"/>
</svg>
